<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Mashup match and flame</title>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#fffaf0" stroke="#111827" stroke-width="4"/>

  <!-- The heavy diagonal and oversized head preserve the match at favicon sizes. -->
  <path d="M13 51 36.5 30" fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="39" cy="28" rx="7.5" ry="9" transform="rotate(-42 39 28)" fill="#111827"/>

  <!-- A two-tone flame reads as a single silhouette at 16px and gains detail above 32px. -->
  <path d="M39.5 29.5C32 25.5 32.5 18 38.5 12c2.7-2.7 4.2-5.1 4.3-8 6.5 5.7 10.3 11.4 9.7 17.8-.7 7.1-5.8 11.1-11.2 11.1-3 0-5.3-1.2-6.8-3.2 1.7.8 3.4.7 5-.2Z" fill="#ef4f2f" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M42 27.5c-3.5-2.3-2.7-6.2.4-9.5.8 3 3.9 4.2 3.4 7.3-.3 2-1.7 3.4-3.8 3.7Z" fill="#ffd166"/>
</svg>
